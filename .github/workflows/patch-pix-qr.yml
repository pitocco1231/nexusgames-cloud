name: Patch Pix QR attachment

on:
  push:
    paths:
      - '.github/workflows/patch-pix-qr.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Discord Pix response
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/api/discord/interactions/route.ts')
          s = p.read_text()

          old = '''async function editDeferredInteraction(interactionToken: string, data: Record<string, unknown>) {
  const response = await fetch(`${DISCORD_API}/webhooks/${APPLICATION_ID}/${interactionToken}/messages/@original`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
    cache: "no-store"
  });
  if (!response.ok) {
    const text = await response.text();
    throw new Error(`Discord webhook ${response.status}: ${text.slice(0, 300)}`);
  }
}
'''

          new = '''async function editDeferredInteraction(interactionToken: string, data: Record<string, unknown>) {
  const response = await fetch(`${DISCORD_API}/webhooks/${APPLICATION_ID}/${interactionToken}/messages/@original`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
    cache: "no-store"
  });
  if (!response.ok) {
    const text = await response.text();
    throw new Error(`Discord webhook ${response.status}: ${text.slice(0, 300)}`);
  }
}

async function editDeferredInteractionWithPixQr(
  interactionToken: string,
  data: Record<string, unknown>,
  qrCodeBase64?: string | null
) {
  if (!qrCodeBase64) {
    return editDeferredInteraction(interactionToken, data);
  }

  const rawBase64 = qrCodeBase64.replace(/^data:image\\/[^;]+;base64,/, "");
  const png = Buffer.from(rawBase64, "base64");
  if (!png.length) {
    return editDeferredInteraction(interactionToken, data);
  }

  const embeds = Array.isArray(data.embeds)
    ? data.embeds.map((embed, index) =>
        index === 0 && embed && typeof embed === "object"
          ? { ...(embed as Record<string, unknown>), image: { url: "attachment://pix-qrcode.png" } }
          : embed
      )
    : [];

  const payload = {
    ...data,
    embeds,
    attachments: [{ id: 0, filename: "pix-qrcode.png", description: "QR Code Pix NexusGames" }]
  };

  const form = new FormData();
  form.append("payload_json", JSON.stringify(payload));
  form.append("files[0]", new Blob([png], { type: "image/png" }), "pix-qrcode.png");

  const response = await fetch(`${DISCORD_API}/webhooks/${APPLICATION_ID}/${interactionToken}/messages/@original`, {
    method: "PATCH",
    body: form,
    cache: "no-store"
  });
  if (!response.ok) {
    const text = await response.text();
    throw new Error(`Discord webhook ${response.status}: ${text.slice(0, 300)}`);
  }
}
'''

          if old not in s:
              raise SystemExit('editDeferredInteraction snippet not found')
          s = s.replace(old, new, 1)

          old_sandbox = '    await editDeferredInteraction(params.interactionToken, pixSandboxMessageData(localOrder.order_number, providerOrder));'
          new_sandbox = '''    const pix = getPixDetails(providerOrder);
    await editDeferredInteractionWithPixQr(
      params.interactionToken,
      pixSandboxMessageData(localOrder.order_number, providerOrder),
      pix.qrCodeBase64
    );'''
          if old_sandbox not in s:
              raise SystemExit('sandbox Pix edit snippet not found')
          s = s.replace(old_sandbox, new_sandbox, 1)

          old_live = '    await editDeferredInteraction(params.interactionToken, pixLiveMessageData(localOrder.order_number, providerOrder));'
          new_live = '''    const pix = getPixDetails(providerOrder);
    await editDeferredInteractionWithPixQr(
      params.interactionToken,
      pixLiveMessageData(localOrder.order_number, providerOrder),
      pix.qrCodeBase64
    );'''
          if old_live not in s:
              raise SystemExit('live Pix edit snippet not found')
          s = s.replace(old_live, new_live, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "nexusgames-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/discord/interactions/route.ts
          git commit -m "feat: show Pix QR code directly in Discord"
          git push
